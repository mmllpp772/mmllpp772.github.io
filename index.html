<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liam 的工具箱</title>
<meta name="description" content="Liam 用 AI 做的小工具：影像與影片、辦公效率、探索與娛樂、3D 場景。">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="工具箱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a launcher — dark masthead with greeting and search, then category sections of compact tool rows */
:root{
  --bg:#f1f2f4; --card:#ffffff; --ink:#14161b; --muted:#646b77; --line:#e1e4e9; --hover:#f4f5f7;
  --head:#14161b; --head-ink:#f3f4f6; --head-muted:#9097a3; --head-line:#2a2e36;
  --accent:#ff7a45;
  --c1:#7c5cff; --c2:#e8951f; --c3:#14a085; --c4:#64748b; --c5:#2f7be5; --c6:#e0507a;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1013; --card:#171a1f; --ink:#eef0f3; --muted:#9aa1ad; --line:#252930; --hover:#1f232a;
  --head:#08090b; --head-line:#1f232a;
  --c1:#a08bff; --c2:#f5b453; --c3:#3fc8ad; --c4:#9aa8bc; --c5:#6ea6f5; --c6:#f07c9c;
  color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
.in{max-width:1040px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* masthead */
.head{background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top,0px);position:relative;overflow:hidden}
.head::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--head-line) 1px,transparent 1px),linear-gradient(90deg,var(--head-line) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(180deg,#000,transparent 95%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 95%)}
.head .in{position:relative;padding-block:clamp(26px,6vw,52px) clamp(22px,5vw,38px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;font:500 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--head-muted);text-transform:uppercase}
.top a{color:inherit;text-decoration:none}
.top a:hover{color:var(--head-ink)}
.clock{font-variant-numeric:tabular-nums;letter-spacing:.06em}
h1{margin:6px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6.4vw,52px);line-height:1.15;letter-spacing:.01em}
h1 .dot{color:var(--accent)}
.sub{margin:0;color:var(--head-muted);max-width:34em}
.search{margin-top:6px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--head-line);border-radius:12px;padding:0 14px;max-width:520px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;width:18px;height:18px;color:var(--head-muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--head-ink);font:inherit;padding:12px 0;outline:none}
.search input::placeholder{color:var(--head-muted)}
.search kbd{font:500 11px/1 var(--f-mono);color:var(--head-muted);border:1px solid var(--head-line);border-radius:5px;padding:4px 6px}
@media (pointer:coarse){.search kbd{display:none}}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump a{font-size:13px;color:var(--head-ink);text-decoration:none;border:1px solid var(--head-line);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:7px}
.jump a:hover{border-color:var(--head-muted)}
.jump i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.jump a:focus-visible,.search input:focus-visible{outline:none}
.jump a:focus-visible{border-color:var(--accent)}

/* sections */
main{padding-block:clamp(24px,4vw,40px) 24px;display:flex;flex-direction:column;gap:clamp(26px,4vw,40px)}
.cat{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.cat-h{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cat-h h2{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.cat-h p{margin:0;color:var(--muted);font-size:13px;flex:1;min-width:0}
.cat-h span{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}

.tool{--k:var(--c4);display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:14px;row-gap:10px;padding:14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;
  transition:border-color .2s,transform .2s}
.tool:hover{border-color:var(--k);transform:translateY(-1px)}
.tool:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--k);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
@media (prefers-color-scheme: dark){.ico{color:#0e1013}}
.ico svg{width:22px;height:22px}
.txt{min-width:0;display:flex;flex-direction:column}
.name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;line-height:1.35;flex-wrap:wrap}
.name small{font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--k);border:1px solid currentColor;border-radius:999px;padding:3px 7px;white-space:nowrap}
.desc{margin-top:2px;color:var(--muted);font-size:13.5px;line-height:1.5}
.go{color:var(--muted);transition:transform .2s,color .2s}
.go svg{width:18px;height:18px;display:block}
.tool:hover .go{color:var(--k);transform:translateX(3px)}
.subs{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px}
.subs span{font-size:12px;color:var(--muted);background:var(--hover);border-radius:6px;padding:2px 8px}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px}
.none{color:var(--muted);margin:0}

footer{border-top:1px solid var(--line)}
footer .in{padding-block:20px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;color:var(--muted);font-size:13px}
footer a{color:inherit;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.tool,.go{transition:none}}
</style>
</head>
<body>
<header class="head">
  <div class="in">
    <div class="top"><a href="https://github.com/mmllpp772">Liam Chiu · Toolbox</a><span class="clock" id="clock"></span></div>
    <h1 id="greet">晚安，Liam<span class="dot">.</span></h1>
    <p class="sub">我用 AI 做的小工具都在這裡。免安裝，照片、影片和檔案都在你自己的裝置上處理。</p>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="找工具：去背、PDF、流程圖、GIF…" aria-label="搜尋工具" autocomplete="off"><kbd>/</kbd></label>
    <nav class="jump" id="jump" aria-label="分類"></nav>
  </div>
</header>

<main class="in" id="main"></main>

<footer><div class="in"><span>做了新工具就掛上來。</span><a href="https://github.com/mmllpp772">github.com/mmllpp772</a></div></footer>

<script>
// ---- 分類 ----
const CATS = [
  { id: "media",  name: "影像與影片", note: "去背、馬賽克、轉 GIF、壓縮", color: "c1" },
  { id: "office", name: "辦公效率",   note: "PDF、QR 碼、流程圖",       color: "c5" },
  { id: "fun",    name: "探索與娛樂", note: "看直播、做迷因",           color: "c3" },
  { id: "3d",     name: "3D 場景",   note: "可以走進去逛的 3D 空間",   color: "c4" },
];
// ---- 工具：加一筆就會出現在對應分類 ----
const TOOLS = [
  { cat: "media", name: "影像工作台", repo: "image-tools", icon: "cut", color: "c1", badge: "4 合 1",
    desc: "照片 AI 去背、影片臉部馬賽克、影片轉 GIF、GoPro 影片瘦身。",
    subs: ["照片去背", "臉部馬賽克", "影片轉 GIF", "影片瘦身"] },
  { cat: "office", name: "辦公工具箱", repo: "office-tools", icon: "doc", color: "c5", badge: "2 合 1",
    desc: "PDF 合併、分割、浮水印、轉圖片；QR 碼與條碼可批次排成標籤列印。",
    subs: ["PDF 工具箱", "QR 條碼產生器"] },
  { cat: "office", name: "流程繪", repo: "flowforge", icon: "flow", color: "c6",
    desc: "拖拉式畫流程圖：新增節點、拉連線、調整樣式與對齊。", keys: "flowchart 流程圖" },
  { cat: "fun", name: "野生直播地圖", repo: "wildcams", icon: "globe", color: "c3", badge: "LIVE",
    desc: "全世界近 300 個動物直播的互動地圖，點地圖或清單就能看。" },
  { cat: "fun", name: "喵股製片所", repo: "cat-stock-meme-studio", icon: "cat", color: "c2",
    desc: "上傳股票截圖或影片，配上貓貓模板和配樂，做成迷因短影片。" },
  { cat: "3d", name: "廠區 3D 漫遊", repo: "zhubei-3d", icon: "cube", color: "c4", badge: "需要密碼",
    desc: "內部版 3D 場景。內容已加密，打開後輸入密碼才看得到。" },
];

const ICONS = {
  cut:   '<path d="M8.1 7.9 20 20M8.1 16.1 20 4"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>',
  doc:   '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 12h6M9 16h4"/>',
  flow:  '<rect x="3" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="16" width="7" height="5" rx="1.5"/><path d="M6.5 8v4.5h11V16"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  cat:   '<path d="M4 20V8l3-4 3 4h4l3-4 3 4v12z"/><path d="M9 13h.01M15 13h.01M11 16.5h2"/>',
  cube:  '<path d="M12 3 20 7.5v9L12 21 4 16.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/>',
  tool:  '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5"/>',
};
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ARROW = svg('<path d="M5 12h14M13 6l6 6-6 6"/>');
const USER = "mmllpp772";
const url = t => t.url || `https://${USER}.github.io/${t.repo}/`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hl = (s, term) => { const e = esc(s); if (!term) return e; const i = e.toLowerCase().indexOf(term); return i < 0 ? e : e.slice(0, i) + "<mark>" + e.slice(i, i + term.length) + "</mark>" + e.slice(i + term.length); };

document.getElementById("jump").innerHTML = CATS.map(c =>
  `<a href="#${c.id}" style="--k:var(--${c.color})"><i></i>${esc(c.name)}</a>`).join("");

function render() {
  const term = document.getElementById("q").value.trim().toLowerCase();
  const hit = t => !term || [t.name, t.desc, t.repo, t.badge || "", t.keys || "", ...(t.subs || [])].join(" ").toLowerCase().includes(term);
  let html = "", n = 0;
  for (const c of CATS) {
    const list = TOOLS.filter(t => t.cat === c.id && hit(t));
    if (!list.length) continue;
    n += list.length;
    html += `<section class="cat" id="${c.id}">
      <div class="cat-h"><h2>${esc(c.name)}</h2><p>${esc(c.note)}</p><span>${list.length}</span></div>
      <div class="list">${list.map(t => `
        <a class="tool" href="${url(t)}" style="--k:var(--${t.color || c.color})">
          <span class="ico">${svg(ICONS[t.icon] || ICONS.tool)}</span>
          <span class="txt"><span class="name">${hl(t.name, term)}${t.badge ? `<small>${esc(t.badge)}</small>` : ""}</span>
            <span class="desc">${hl(t.desc, term)}</span></span>
          <span class="go">${ARROW}</span>
          ${t.subs ? `<span class="subs">${t.subs.map(s => `<span>${hl(s, term)}</span>`).join("")}</span>` : ""}
        </a>`).join("")}</div></section>`;
  }
  document.getElementById("main").innerHTML = n ? html : '<p class="none">找不到符合的工具，換個關鍵字試試。</p>';
}
document.getElementById("q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
});
render();

// greeting + clock, from the viewer's own clock
function tick() {
  const d = new Date(), h = d.getHours();
  const g = h < 5 ? "夜深了" : h < 11 ? "早安" : h < 14 ? "午安" : h < 18 ? "下午好" : "晚安";
  document.getElementById("greet").innerHTML = `${g}，Liam<span class="dot">.</span>`;
  document.getElementById("clock").textContent = d.toLocaleDateString("zh-TW", { month: "numeric", day: "numeric", weekday: "short" }) + " " +
    String(h).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
tick(); setInterval(tick, 30000);
</script>
</body>
</html>
